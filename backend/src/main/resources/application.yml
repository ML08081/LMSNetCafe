server:
  port: 8080

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-lifecycle.sql
  application:
    name: lms-netcafe-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lms_netcafe}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

lms:
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://127.0.0.1:11434/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:12}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1600}
    token-parameter: ${AI_TOKEN_PARAMETER:max_completion_tokens}
  jwt-secret: ${JWT_SECRET:replace-with-a-long-random-secret}
  face-service-url: ${FACE_SERVICE_URL:http://127.0.0.1:9000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://172.*:*,http://10.*:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
