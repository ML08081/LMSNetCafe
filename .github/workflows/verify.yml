name: Verify project
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml test
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: netcafe_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Real MySQL transaction and authorization regression
        run: >-
          mvn -B -f backend/pom.xml test
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/netcafe_test?serverTimezone=Asia/Shanghai
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          -Dspring.datasource.username=root
          -Dspring.datasource.password=test-only-password
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      - run: npm run build:pet
  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: face-service/requirements.txt
      - run: pip install -r face-service/requirements.txt
      - run: python download_models.py
        working-directory: face-service
      - run: python tests/download_fixtures.py
        working-directory: face-service
      - run: python -m unittest discover -s tests -v
        working-directory: face-service
